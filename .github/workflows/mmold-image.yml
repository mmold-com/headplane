name: MMold verified image
on:
  push:
    branches: ["mmold/zh-tw"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mmold-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@10.4.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit
      - run: pnpm run typecheck
      - run: pnpm exec vitest run --project integration:oidc
  image:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: Dockerfile
          build-args: |
            IMAGE_TAG=${{ github.sha }}
            HEADPLANE_VERSION=0.8.2-mmold
          platforms: linux/amd64
          push: true
          tags: ghcr.io/mmold-com/headplane:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/mmold-com/headplane
      - run: echo 'Image digest ${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
